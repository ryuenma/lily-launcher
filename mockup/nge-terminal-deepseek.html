<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LILY // NGE TERMINAL — DeepSeek</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
:root{
  --font-jp:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-en:"Oswald","Arial Narrow","Helvetica Neue",sans-serif;
  --font-mono:"JetBrains Mono","Consolas",monospace;
  --chassis:#3a3448;
  --button:#b9afcb;
  --desk:#17151d;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:
    radial-gradient(ellipse at 18% 10%, rgba(90,80,110,.16), transparent 42%),
    radial-gradient(ellipse at 82% 92%, rgba(120,45,30,.10), transparent 46%),
    #17151d;
  color:#c8c4d2;
  font-family:var(--font-en);
  display:flex;
  gap:22px;
  align-items:flex-start;
  padding:22px;
  min-height:100vh;
}
/* ───────── DEVICE / BEZEL ───────── */
.device-col{display:flex;flex-direction:column;gap:10px;flex-shrink:0}
.bezel{
  width:1052px;height:628px;padding:14px;position:relative;
  background:
    linear-gradient(152deg,#514a61 0%,#3d374b 22%,#2c2738 58%,#1f1c29 100%);
  border:1px solid #5d566e;
  border-radius:15px;
  flex-shrink:0;
}
.bezel::before{
  content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.07);
  border-radius:11px;pointer-events:none;
}
.bezel::after{
  content:"";position:absolute;width:74px;height:4px;left:50%;bottom:5px;transform:translateX(-50%);
  background:repeating-linear-gradient(90deg,#17141f 0 3px,#4f485e 3px 6px);
  border-radius:2px;opacity:.8;pointer-events:none;
}
.screen{
  width:1024px;height:600px;position:relative;overflow:hidden;
  background:var(--bg);
  display:flex;flex-direction:column;
  border-radius:3px;
  font-family:var(--font-en);
  isolation:isolate;
  transition:none;
}
/* STATE PALETTES — instant, no animation */
.screen[data-zone="normal"]{
  --bg:#0a0a12;
  --c1:#ff4a1c;
  --c2:#4de89a;
  --c3:#f5b400;
  --c4:#258ac3;
  --fill:#ff4a1c;
  --knock:#08080e;
  --readout:#4de89a;
  --line:rgba(255,74,28,.26);
  --line-strong:rgba(255,74,28,.52);
  --panel:rgba(6,6,13,.76);
  --panel2:rgba(10,10,19,.92);
  --alert:#f5b400;
}
.screen[data-zone="caution"]{
  --bg:#0a0904;
  --c1:#f5b400;
  --c2:#ff6a00;
  --c3:#f5b400;
  --c4:#ff6a00;
  --fill:#f5b400;
  --knock:#0a0904;
  --readout:#f5b400;
  --line:rgba(245,180,0,.26);
  --line-strong:rgba(245,180,0,.52);
  --panel:rgba(8,7,3,.78);
  --panel2:rgba(12,10,4,.94);
  --alert:#ff6a00;
}
.screen[data-zone="emergency"]{
  --bg:#000000;
  --c1:#ff4a1c;
  --c2:#ff6a00;
  --c3:#e31c23;
  --c4:#4de89a;
  --fill:#e31c23;
  --knock:#4de89a;
  --readout:#ff4a1c;
  --line:rgba(255,74,28,.30);
  --line-strong:rgba(255,74,28,.58);
  --panel:rgba(0,0,0,.82);
  --panel2:rgba(3,3,3,.96);
  --alert:#e31c23;
}
/* Night / graphite only affect the calm state; safety palettes win at speed */
.screen.night[data-zone="normal"]{
  --bg:#050508;
  --c1:#b9afcb;
  --c2:#4de89a;
  --c3:#f5b400;
  --c4:#258ac3;
  --fill:#b9afcb;
  --knock:#050508;
  --readout:#4de89a;
  --line:rgba(185,175,203,.22);
  --line-strong:rgba(185,175,203,.46);
  --panel:rgba(4,4,8,.80);
  --panel2:rgba(7,7,12,.94);
}
.screen.graphite[data-zone="normal"]{
  --bg:#0f1015;
  --c1:#d8d2e0;
  --c2:#4de89a;
  --c3:#f5b400;
  --c4:#258ac3;
  --fill:#d8d2e0;
  --knock:#0f1015;
  --readout:#4de89a;
  --line:rgba(216,210,224,.20);
  --line-strong:rgba(216,210,224,.42);
  --panel:rgba(12,13,18,.80);
  --panel2:rgba(16,17,23,.94);
}
/* ───────── BACKGROUND LAYERS ───────── */
.hexbg{
  position:absolute;inset:0;width:100%;height:100%;z-index:0;
  color:var(--c1);pointer-events:none;
}
.hex-cell{fill:none;stroke:currentColor;stroke-width:.9;opacity:.10}
.hex-cell.major{opacity:.17}
.screen[data-zone="caution"] .hex-cell.alert{fill:var(--c1);fill-opacity:.055;opacity:.16}
.screen[data-zone="emergency"] .hex-cell.alert{fill:var(--c3);fill-opacity:.10;opacity:.20}
.vignette{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 52%,rgba(0,0,0,.38) 100%);
}
.scanlines{
  position:absolute;inset:0;z-index:110;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px);
  opacity:.46;mix-blend-mode:multiply;
}
/* ───────── HAZARD STRIPS ───────── */
.hazard{flex:0 0 7px;position:relative;z-index:4;background:transparent}
.hazard::before,.hazard::after{
  content:"";position:absolute;left:0;right:0;height:1px;background:var(--line);opacity:.5;
}
.hazard::before{top:0}.hazard::after{bottom:0}
.screen[data-zone="caution"] .hazard{
  background:repeating-linear-gradient(-45deg,var(--c1) 0 9px,#08070a 9px 18px);
}
.screen[data-zone="emergency"] .hazard{
  background:repeating-linear-gradient(-45deg,var(--c3) 0 9px,#000 9px 18px);
}
/* ───────── HEADER BANNER ───────── */
.nge-header{
  flex:0 0 62px;display:grid;grid-template-columns:172px 1fr 172px;gap:6px;
  margin:0 8px;position:relative;z-index:3;
}
.hdr-rail{
  border:1px solid var(--c1);background:rgba(0,0,0,.38);
  display:flex;align-items:center;justify-content:space-between;gap:5px;
  padding:0 6px;position:relative;overflow:hidden;
}
.hdr-rail::before,.hdr-rail::after{
  content:"";position:absolute;left:0;right:0;height:2px;opacity:.8;
  background:repeating-linear-gradient(90deg,var(--c1) 0 4px,transparent 4px 8px);
}
.hdr-rail::before{top:0}.hdr-rail::after{bottom:0}
.rail-bars{
  width:42px;height:34px;flex:0 0 auto;
  background:repeating-linear-gradient(90deg,var(--c1) 0 1px,transparent 1px 5px);
  opacity:.72;position:relative;
}
.rail-bars::after{
  content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;
  transform:translate(-50%,-50%) rotate(45deg);background:var(--c1);
}
.banner{
  position:relative;border:1px solid var(--c1);background:rgba(0,0,0,.46);
  display:flex;flex-direction:column;justify-content:center;align-items:center;
  gap:2px;padding:4px 20px;overflow:hidden;text-align:center;
}
.banner::before,.banner::after{
  content:"";position:absolute;top:0;bottom:0;width:10px;opacity:.55;
  background:repeating-linear-gradient(180deg,var(--c1) 0 3px,transparent 3px 7px);
}
.banner::before{left:0}.banner::after{right:0}
.banner-kicker{
  font-size:7px;letter-spacing:3.2px;color:var(--c2);opacity:.9;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
.banner-title{
  font-family:var(--font-en),var(--font-jp);
  font-size:21px;font-weight:700;line-height:1.02;letter-spacing:.8px;
  color:var(--c1);white-space:nowrap;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;
}
.banner-sub{
  font-family:var(--font-jp);font-size:8px;font-weight:700;letter-spacing:1.2px;
  color:var(--c2);display:flex;gap:7px;align-items:baseline;white-space:nowrap;
}
.banner-sub .sep{opacity:.45}
.screen[data-zone="caution"] .banner{background:var(--c1);border-color:var(--c1)}
.screen[data-zone="caution"] .banner-title,
.screen[data-zone="caution"] .banner-kicker,
.screen[data-zone="caution"] .banner-sub{color:#0a0904}
.screen[data-zone="caution"] .banner::before,
.screen[data-zone="caution"] .banner::after{background:repeating-linear-gradient(180deg,#0a0904 0 3px,transparent 3px 7px)}
.screen[data-zone="emergency"] .banner{background:var(--c3);border-color:var(--c3)}
.screen[data-zone="emergency"] .banner-title,
.screen[data-zone="emergency"] .banner-kicker,
.screen[data-zone="emergency"] .banner-sub{color:var(--knock)}
.screen[data-zone="emergency"] .banner::before,
.screen[data-zone="emergency"] .banner::after{background:repeating-linear-gradient(180deg,var(--knock) 0 3px,transparent 3px 7px)}
/* ───────── OCTAGONAL SEALS ───────── */
.seal-oct{
  background:var(--c1);padding:2px;flex:0 0 auto;
  clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);
  display:flex;transform:rotate(-4deg);
}
.seal-oct .seal-in{
  background:var(--bg);width:100%;height:100%;clip-path:inherit;flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;line-height:1;color:var(--c1);text-align:center;
}
.seal-oct b{font-family:var(--font-jp);font-size:10px;font-weight:900;letter-spacing:0}
.seal-oct span{font-family:var(--font-en);font-size:5px;letter-spacing:1px;opacity:.85}
.seal-lg{width:50px;height:50px}
.seal-md{width:44px;height:44px}
.seal-sm{width:38px;height:38px}
.seal-oct.seal-fill{background:var(--c3)}
.seal-oct.seal-fill .seal-in{background:var(--c3);color:var(--knock)}
/* ───────── TICKER ───────── */
.ticker{
  display:none;flex:0 0 16px;margin:0 8px;overflow:hidden;position:relative;z-index:3;
  align-items:center;background:var(--c1);color:#08080e;
  border-left:2px solid var(--c1);border-right:2px solid var(--c1);
}
.ticker.show{display:flex}
.ticker.emergency{background:var(--c3);color:var(--knock);border-color:var(--c3)}
.ticker-track{display:inline-flex;white-space:nowrap;will-change:transform;animation:tick 30s linear infinite}
.tick-half{display:inline-flex;flex:0 0 auto}
.tick-half span{
  font-family:var(--font-jp);font-weight:700;font-size:9px;letter-spacing:2.4px;
  padding-right:34px;white-space:nowrap;
}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* ───────── MAIN GRID ───────── */
.main{
  flex:1;min-height:0;display:grid;grid-template-columns:152px minmax(0,1fr) 152px;
  gap:6px;margin:0 8px;padding-top:6px;position:relative;z-index:3;
}
.meta-col{
  position:relative;border:1px solid var(--line-strong);background:var(--panel);
  padding:7px 11px 6px 6px;display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.meta-col::before{
  content:"";position:absolute;top:0;left:0;right:0;height:4px;opacity:.85;
  background:repeating-linear-gradient(90deg,var(--c1) 0 6px,transparent 6px 10px);
}
.meta-head{
  display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px solid var(--c2);padding:5px 0 3px;margin-top:2px;gap:4px;
}
.meta-head .jp{font-family:var(--font-jp);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--c1);white-space:nowrap}
.meta-head .en{font-size:5.5px;letter-spacing:1.4px;color:var(--c2);opacity:.85;white-space:nowrap}
.mrow{display:flex;justify-content:space-between;gap:4px;border-bottom:1px dotted var(--line);padding:3px 0;line-height:1.15}
.mrow .k{font-size:6px;letter-spacing:1.2px;color:var(--c1);opacity:.68;white-space:nowrap}
.mrow .v{font-family:var(--font-mono);font-size:7.5px;font-weight:700;color:var(--c2);white-space:nowrap;text-align:right}
.mrow .v.hot{color:var(--c3)}
.meta-vrail{
  position:absolute;top:44px;right:2px;writing-mode:vertical-rl;
  font-family:var(--font-jp);font-size:6.5px;font-weight:700;letter-spacing:2.5px;
  color:var(--c1);opacity:.34;pointer-events:none;white-space:nowrap;
}
.barcode{
  height:22px;margin-top:6px;border:1px solid var(--line);opacity:.62;
  background:repeating-linear-gradient(90deg,
    var(--c1) 0 1px,transparent 1px 3px,
    var(--c1) 3px 4px,transparent 4px 6px,
    var(--c1) 6px 8px,transparent 8px 11px,
    var(--c1) 11px 12px,transparent 12px 15px);
}
.barcode-label{
  display:flex;justify-content:space-between;font-family:var(--font-mono);
  font-size:5px;letter-spacing:.6px;color:var(--c1);opacity:.55;margin-top:2px;
}
.meta-foot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:4px;padding-top:6px}
.meta-note{font-family:var(--font-mono);font-size:5.5px;line-height:1.6;letter-spacing:.6px;color:var(--c1);opacity:.55;text-align:right}
.clock-block{border:1px solid var(--line);background:rgba(0,0,0,.35);padding:4px 5px;margin-top:6px}
.clock-k{font-size:5.5px;letter-spacing:1.4px;color:var(--c1);opacity:.65;margin-bottom:1px}
.clock-v{font-family:var(--font-mono);font-size:14px;font-weight:700;letter-spacing:.5px;color:var(--c2);line-height:1.1}
.clock-s{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:5px;color:var(--c1);opacity:.55;letter-spacing:.6px;margin-top:1px}
/* ───────── CENTER / DISPLAY ───────── */
.center{display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0}
.display{
  flex:1;min-height:0;border:1px solid var(--c1);background:var(--panel);
  position:relative;display:flex;flex-direction:column;padding:6px 9px 5px;overflow:hidden;
}
.display::before{
  content:"";position:absolute;inset:3px;border:1px solid var(--line);pointer-events:none;
}
.cnr{position:absolute;width:10px;height:10px;border-color:var(--c2);border-style:solid;border-width:0;z-index:2;pointer-events:none}
.cnr.tl{top:2px;left:2px;border-top-width:2px;border-left-width:2px}
.cnr.tr{top:2px;right:2px;border-top-width:2px;border-right-width:2px}
.cnr.bl{bottom:2px;left:2px;border-bottom-width:2px;border-left-width:2px}
.cnr.br{bottom:2px;right:2px;border-bottom-width:2px;border-right-width:2px}
.display-head{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-bottom:1px solid var(--line-strong);padding:0 2px 3px;position:relative;z-index:2;
}
.dh-left{display:flex;align-items:baseline;gap:9px;min-width:0}
.dh-en{font-size:8px;letter-spacing:2.8px;color:var(--c1);white-space:nowrap}
.dh-jp{font-family:var(--font-jp);font-size:8.5px;font-weight:700;letter-spacing:1px;color:var(--c2);white-space:nowrap}
.dh-right{font-family:var(--font-mono);font-size:6px;letter-spacing:.8px;color:var(--c1);opacity:.65;white-space:nowrap;text-align:right}
.display-body{flex:1;min-height:0;position:relative;display:flex;align-items:stretch;padding:3px 1px 0;z-index:2}
.display-foot{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border-top:1px solid var(--line-strong);margin-top:3px;padding:2px 2px 0;
  font-family:var(--font-mono);font-size:6px;letter-spacing:.6px;color:var(--c1);
  opacity:.68;white-space:nowrap;overflow:hidden;position:relative;z-index:2;
}
.display-foot b{font-family:var(--font-jp);font-weight:700;letter-spacing:1px;opacity:.9}
/* now playing */
.np{display:flex;gap:14px;align-items:center;width:100%;min-width:0;padding:1px 3px}
.np-hex{flex:0 0 92px;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.np-hex svg{width:88px;height:94px;display:block}
.np-hex .hexplate{fill:rgba(0,0,0,.4);stroke:var(--c2);stroke-width:1.1}
.np-hex .hexhatch{stroke:var(--line-strong);stroke-width:.6;opacity:.7}
.np-hex .hexnum{fill:var(--c2);font-family:var(--font-mono);font-size:27px;font-weight:700;text-anchor:middle}
.np-hex .hexcode{fill:var(--c1);font-family:var(--font-en);font-size:5px;letter-spacing:1.5px;text-anchor:middle}
.np-hex .cap{font-size:5.5px;letter-spacing:2px;color:var(--c1);opacity:.7}
.np-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.np-kicker{font-family:var(--font-jp);font-size:7px;font-weight:700;letter-spacing:2px;color:var(--c1);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-title{
  font-family:var(--font-en);font-weight:700;font-size:31px;line-height:1;
  letter-spacing:.6px;color:var(--c2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.np-artist{font-family:var(--font-jp);font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--c1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-artist span{opacity:.55;font-size:9px}
.np-progress{display:flex;flex-direction:column;gap:2px;margin-top:1px}
.np-bar{height:6px;background:rgba(0,0,0,.45);border:1px solid var(--line);position:relative;overflow:hidden}
.np-bar i{display:block;height:100%;background:var(--ua)}
.np-time{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:6.5px;color:var(--c1);opacity:.7;letter-spacing:.5px}
.np-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:1px}
.tag{font-size:5.5px;letter-spacing:1.2px;border:1px solid var(--line-strong);padding:1px 4px;color:var(--c1);opacity:.8;white-space:nowrap}
.tag.fill{background:var(--c2);color:var(--bg);border-color:var(--c2);opacity:1}
.stamp{
  position:absolute;right:14px;top:32px;border:2px solid var(--c3);color:var(--c3);
  font-family:var(--font-jp);font-size:11px;font-weight:900;letter-spacing:2px;padding:2px 8px;
  transform:rotate(-5deg);background:rgba(0,0,0,.32);z-index:3;white-space:nowrap;
}
/* radio */
.radio{display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;padding:0 4px}
.radio-top{display:flex;align-items:flex-end;gap:10px}
.freqband{font-size:13px;color:var(--c1);padding-bottom:7px;letter-spacing:1px}
.freqnum{font-family:var(--font-mono);font-size:46px;font-weight:700;line-height:.9;color:var(--c2);letter-spacing:-1px}
.frequnit{font-size:9px;color:var(--c1);padding-bottom:7px;letter-spacing:1px}
.radio-station{font-family:var(--font-jp);font-size:14px;font-weight:700;color:var(--c1);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.radio-station span{font-size:9px;opacity:.55}
.tuner{width:100%;height:44px;margin-top:1px;display:block}
.radio-tags{display:flex;gap:4px;margin-top:2px}
/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;text-align:center;position:relative}
.empty .big{font-family:var(--font-en);font-size:38px;font-weight:700;letter-spacing:7px;color:var(--c1);line-height:1}
.empty .jp{font-family:var(--font-jp);font-size:13px;font-weight:700;letter-spacing:4px;color:var(--c2)}
.empty .small{font-size:6.5px;letter-spacing:2.2px;color:var(--c1);opacity:.55;margin-top:2px}
.empty .bars{display:flex;gap:3px;margin-top:4px}
.empty .bars i{width:10px;height:4px;background:var(--line-strong)}
.empty .bars i.on{background:var(--c2)}
/* ───────── MAGI TRIANGLE ───────── */
.magi{
  flex:0 0 124px;border:1px solid var(--line-strong);background:var(--panel);
  display:flex;flex-direction:column;padding:3px 8px 2px;position:relative;overflow:hidden;
}
.magi-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  border-bottom:1px solid var(--line);padding-bottom:2px;
  font-size:6.5px;letter-spacing:1.8px;color:var(--c1);white-space:nowrap;
}
.magi-head .jp{font-family:var(--font-jp);font-weight:700;letter-spacing:1px}
.magi-head .right{font-family:var(--font-mono);font-size:6px;color:var(--c2);opacity:.9;letter-spacing:.5px}
.magi svg{flex:1;width:100%;min-height:0;display:block}
.magi-line{stroke:var(--line-strong);stroke-width:.8;fill:none}
.magi-line.hot{stroke:var(--c2);stroke-width:1}
.magi-node{cursor:pointer}
.magi-node .hex{fill:rgba(0,0,0,.45);stroke:var(--c1);stroke-width:1.1}
.magi-node .hex-in{fill:none;stroke:var(--line);stroke-width:.6}
.magi-node .n-lbl{fill:var(--c1);font-family:var(--font-en);font-size:12px;font-weight:700;letter-spacing:1px;text-anchor:middle}
.magi-node .n-code{fill:var(--c1);font-family:var(--font-mono);font-size:4.6px;letter-spacing:.5px;text-anchor:middle;opacity:.6}
.magi-node .n-name{fill:var(--c1);font-family:var(--font-en);font-size:6px;font-weight:600;letter-spacing:1.4px;text-anchor:middle}
.magi-node .n-jp{fill:var(--c2);font-family:var(--font-jp);font-size:5.5px;letter-spacing:.5px;text-anchor:middle;opacity:.8}
.magi-node.active .hex{fill:var(--c2);stroke:var(--c2)}
.magi-node.active .n-lbl{fill:var(--bg)}
.magi-node.active .n-code{fill:var(--bg);opacity:.7}
.magi-center .diamond{fill:var(--c1);stroke:none}
.magi-center .cross{stroke:var(--c2);stroke-width:.8;opacity:.7}
.magi-center .c-lbl{fill:var(--c2);font-family:var(--font-en);font-size:5.5px;font-weight:700;letter-spacing:1.5px;text-anchor:middle}
/* ───────── BOTTOM DECK ───────── */
.deck{
  flex:0 0 130px;display:grid;grid-template-columns:minmax(0,1fr) 176px 186px;
  gap:8px;margin:0 8px;padding-top:5px;position:relative;z-index:3;
  border-top:1px solid var(--line-strong);
}
.deck::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--c1) 0 4px,transparent 4px 9px);
}
.deck-panel{display:flex;flex-direction:column;min-height:0;position:relative}
.deck-label{
  display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  font-size:6px;letter-spacing:2px;color:var(--c1);opacity:.85;
  border-bottom:1px solid var(--line);padding-bottom:2px;margin-bottom:2px;white-space:nowrap;
}
.deck-label .jp{font-family:var(--font-jp);font-weight:700;letter-spacing:1px;color:var(--c2);opacity:.9}
.key-grid{flex:1;width:100%;min-height:0;display:block}
.hex-key{cursor:pointer;outline:none}
.hex-key .hex-fill{fill:rgba(0,0,0,.52);stroke:var(--c1);stroke-width:1.15}
.hex-key .hex-in{fill:none;stroke:var(--line);stroke-width:.55}
.hex-key .k-num{fill:var(--c1);font-family:var(--font-mono);font-size:4.6px;text-anchor:middle;opacity:.42}
.hex-key .k-label{fill:var(--c1);font-family:var(--font-en);font-size:8px;font-weight:700;letter-spacing:1px;text-anchor:middle}
.hex-key .k-jp{fill:var(--c1);font-family:var(--font-jp);font-size:5px;text-anchor:middle;opacity:.55}
.hex-key:hover .hex-fill{fill:var(--c1);fill-opacity:.18}
.hex-key.source-on .hex-fill{fill:var(--c2);stroke:var(--c2)}
.hex-key.source-on .k-label,.hex-key.source-on .k-num,.hex-key.source-on .k-jp{fill:var(--bg);opacity:1}
.hex-key.accent-on .hex-fill{fill:var(--ua);stroke:var(--ua)}
.hex-key.accent-on .k-label,.hex-key.accent-on .k-num,.hex-key.accent-on .k-jp{fill:var(--bg);opacity:1}
.hex-key.latched .hex-fill{fill:var(--c3);stroke:var(--c3)}
.hex-key.latched .k-label,.hex-key.latched .k-num,.hex-key.latched .k-jp{fill:var(--bg);opacity:1}
.hex-key:focus .hex-fill{stroke-width:2.6}
/* volume */
.deck-mid{align-items:center;justify-content:space-between}
.vol-line{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;min-height:0}
.knob-stage{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none;user-select:none}
.knob-stage:active{cursor:grabbing}
.knob-ticks{position:absolute;inset:0;width:100%;height:100%}
.knob{
  width:56px;height:56px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 32%,#514a62 0%,#332e42 42%,#1d1a28 72%,#14121c 100%);
  border:1px solid #6c657f;
}
.knob::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid rgba(255,255,255,.09)}
.knob::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(0,0,0,.5);background:rgba(0,0,0,.12)}
.knob-rot{position:absolute;inset:0;transform:rotate(var(--rot,-135deg))}
.knob-rot::before{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);width:2px;height:11px;background:var(--ua)}
.knob-cap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:7px;font-weight:700;color:var(--c1);opacity:.7;pointer-events:none}
.vol-num{display:flex;flex-direction:column;align-items:center;gap:1px}
.seg-vol svg{height:26px;width:auto;display:block}
.vol-lab{font-size:5.5px;letter-spacing:1.5px;color:var(--c1);opacity:.7}
.vol-sub{display:flex;justify-content:space-between;width:100%;font-family:var(--font-mono);font-size:5.5px;letter-spacing:.4px;color:var(--c1);opacity:.6;border-top:1px solid var(--line);padding-top:2px}
/* speed */
.deck-right{border-left:1px solid var(--line);padding-left:9px}
.speed-box{display:flex;align-items:flex-end;gap:6px;height:50px;margin:2px 0 1px}
.seg-speed svg{height:46px;width:auto;display:block}
.speed-unit{font-size:8px;letter-spacing:1px;color:var(--c1);padding-bottom:5px}
.speed-bar{display:flex;gap:2px;height:5px;margin:1px 0 3px}
.speed-bar i{flex:1;background:var(--line)}
.speed-bar i.on{background:var(--readout)}
.zone-row{display:flex;align-items:center;gap:3px;font-size:5.5px;letter-spacing:1px;color:var(--c1);white-space:nowrap}
.zone-chip{border:1px solid var(--line);padding:1px 3px;opacity:.5;color:var(--c1)}
.zone-chip.on{background:var(--c2);border-color:var(--c2);color:var(--bg);opacity:1;font-weight:700}
.zone-name{margin-left:auto;font-family:var(--font-mono);font-size:5.5px;color:var(--c2);letter-spacing:.5px}
.zone-thresh{font-family:var(--font-mono);font-size:5.5px;letter-spacing:.3px;color:var(--c1);opacity:.55;margin-top:2px;white-space:nowrap}
/* ───────── OVERLAYS / SHEETS ───────── */
.overlay{
  position:absolute;inset:0;z-index:40;display:none;flex-direction:column;
  background:rgba(4,4,9,.95);padding:12px 16px;overflow:hidden;
}
.overlay.show{display:flex}
.ov-head{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;
  gap:12px;border-bottom:2px solid var(--c1);padding-bottom:5px;margin-bottom:8px;
}
.ov-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.ov-title .jp{font-family:var(--font-jp);font-size:20px;font-weight:900;letter-spacing:1px;color:var(--c1);line-height:1}
.ov-title .en{font-size:17px;font-weight:600;letter-spacing:4px;color:var(--c2);line-height:1}
.ov-sub{font-family:var(--font-mono);font-size:6.5px;letter-spacing:1.4px;color:var(--c1);opacity:.6;margin-top:3px}
.ov-tools{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ov-close{
  background:transparent;border:1px solid var(--c1);color:var(--c1);
  font-family:var(--font-en);font-size:8px;font-weight:600;letter-spacing:2px;
  padding:5px 12px;cursor:pointer;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.ov-close:hover{background:var(--c1);color:var(--bg)}
.ov-close.red{border-color:var(--c3);color:var(--c3)}
.ov-close.red:hover{background:var(--c3);color:var(--knock)}
/* more sheet */
.more-grid{
  flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));gap:6px;
}
.more-tile{
  position:relative;border:0;padding:0;cursor:pointer;background:var(--line-strong);
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
  display:flex;text-align:left;font-family:var(--font-en);min-height:0;
}
.more-tile .tile-in{
  position:absolute;inset:1px;background:var(--panel2);
  clip-path:inherit;display:flex;flex-direction:column;gap:3px;padding:6px 7px;
  color:var(--c1);overflow:hidden;min-height:0;
}
.more-tile:hover .tile-in{background:rgba(255,255,255,.045)}
.more-tile.hot{background:var(--c1)}
.more-tile.hot .tile-in{background:var(--c1);color:var(--bg)}
.more-tile.hot:hover .tile-in{background:var(--c2)}
.tile-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-mono);font-size:5.5px;letter-spacing:.8px;opacity:.6}
.tile-ic{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tile-ic svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.5}
.tile-label{font-size:9px;font-weight:700;letter-spacing:1.2px;line-height:1.05}
.tile-jp{font-family:var(--font-jp);font-size:6.5px;font-weight:700;letter-spacing:.5px;opacity:.65;line-height:1.1}
.more-foot{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:7px;padding-top:4px;font-family:var(--font-mono);font-size:6px;letter-spacing:1px;color:var(--c1);opacity:.55}
/* settings */
.settings-list{
  flex:1;min-height:0;border:1px solid var(--line-strong);background:var(--panel2);
  padding:0 16px;display:flex;flex-direction:column;overflow-y:auto;
}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-main{min-width:0}
.set-name{font-size:12px;font-weight:600;letter-spacing:1.2px;color:var(--c1);line-height:1.1}
.set-jp{font-family:var(--font-jp);font-size:7px;font-weight:700;letter-spacing:1px;color:var(--c2);opacity:.75;margin-top:2px}
.set-desc{font-size:6px;letter-spacing:1.2px;color:var(--c1);opacity:.45;margin-top:2px}
.seg{display:flex;gap:3px;flex-shrink:0}
.seg button{
  background:transparent;border:1px solid var(--line-strong);color:var(--c1);
  font-family:var(--font-en);font-size:7.5px;font-weight:600;letter-spacing:1px;
  padding:5px 9px;min-width:52px;cursor:pointer;line-height:1;
}
.seg button:hover{background:rgba(255,255,255,.05)}
.seg button.on{background:var(--c1);border-color:var(--c1);color:var(--bg)}
.accent-row{display:flex;gap:5px;flex-shrink:0}
.accent-sw{
  width:28px;height:28px;border:1px solid rgba(255,255,255,.18);cursor:pointer;
  position:relative;padding:0;
}
.accent-sw.on{outline:2px solid var(--c2);outline-offset:2px}
.accent-sw span{position:absolute;left:0;right:0;bottom:-12px;text-align:center;font-family:var(--font-mono);font-size:5px;color:var(--c1);opacity:.6}
.settings-foot{flex:0 0 auto;display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:7px;padding-top:4px;font-family:var(--font-mono);font-size:6px;letter-spacing:.8px;color:var(--c1);opacity:.5}
/* generic app / phone / bt pages */
.page-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.app-hero{
  flex:1;border:1px solid var(--line-strong);background:var(--panel2);position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;
}
.app-hero .code{font-family:var(--font-mono);font-size:7px;letter-spacing:1.5px;color:var(--c1);opacity:.6}
.app-hero .name{font-size:38px;font-weight:700;letter-spacing:3px;color:var(--c2);line-height:1}
.app-hero .jp{font-family:var(--font-jp);font-size:16px;font-weight:700;letter-spacing:3px;color:var(--c1)}
.app-hero .note{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;color:var(--c1);opacity:.55;max-width:70%;text-align:center;line-height:1.7}
.app-hero .corner-code{position:absolute;font-family:var(--font-mono);font-size:6px;color:var(--c1);opacity:.4;letter-spacing:1px}
.app-hero .corner-code.tl{top:7px;left:8px}.app-hero .corner-code.br{bottom:7px;right:8px}
.app-hero .stripe{position:absolute;left:0;right:0;height:7px;background:repeating-linear-gradient(-45deg,var(--c1) 0 7px,transparent 7px 14px);opacity:.55}
.app-hero .stripe.top{top:0}.app-hero .stripe.bot{bottom:0}
.ov-actions{flex:0 0 auto;display:flex;justify-content:flex-end;gap:6px}
.btn{
  background:transparent;border:1px solid var(--c1);color:var(--c1);cursor:pointer;
  font-family:var(--font-en);font-size:8px;font-weight:600;letter-spacing:2px;padding:7px 15px;
}
.btn:hover{background:var(--c1);color:var(--bg)}
.btn.solid{background:var(--c2);border-color:var(--c2);color:var(--bg)}
.btn.solid:hover{background:var(--c1);border-color:var(--c1)}
.btn.danger{border-color:var(--c3);color:var(--c3)}
.btn.danger:hover{background:var(--c3);color:var(--knock)}
/* device list rows */
.list{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;overflow-y:auto}
.list-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line-strong);background:var(--panel2);padding:10px 12px;cursor:pointer;color:var(--c1);
}
.list-row:hover{background:rgba(255,255,255,.05)}
.list-row.on{background:var(--c2);color:var(--bg);border-color:var(--c2)}
.list-row .lr-main{min-width:0}
.list-row .lr-name{font-size:14px;font-weight:600;letter-spacing:1px;line-height:1.1}
.list-row .lr-meta{font-family:var(--font-mono);font-size:6px;letter-spacing:.7px;opacity:.65;margin-top:2px}
.list-row .lr-jp{font-family:var(--font-jp);font-size:8px;font-weight:700;letter-spacing:1px;opacity:.75}
.list-row .lr-state{font-family:var(--font-mono);font-size:6.5px;letter-spacing:.8px;text-align:right;opacity:.8;white-space:nowrap}
.phone-card{border:1px solid var(--line-strong);background:var(--panel2);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:18px}
.phone-card .pc-k{font-size:6px;letter-spacing:2px;color:var(--c1);opacity:.6}
.phone-card .pc-name{font-size:27px;font-weight:700;letter-spacing:1px;color:var(--c2);line-height:1.05}
.phone-card .pc-jp{font-family:var(--font-jp);font-size:9px;font-weight:700;letter-spacing:1px;color:var(--c1);opacity:.8;margin-top:2px}
.signal{display:flex;align-items:flex-end;gap:2px;height:24px}
.signal i{width:4px;background:var(--c1);opacity:.25}
.signal i:nth-child(1){height:5px}.signal i:nth-child(2){height:9px}
.signal i:nth-child(3){height:14px}.signal i:nth-child(4){height:19px}.signal i:nth-child(5){height:24px}
.signal i.on{background:var(--c2);opacity:1}
.call-log{flex:1;min-height:0;border:1px solid var(--line);overflow-y:auto}
.call-row{display:grid;grid-template-columns:58px 1fr 100px 54px;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:7px;color:var(--c1);align-items:center}
.call-row .cr-type{font-family:var(--font-en);font-size:7px;letter-spacing:1px;font-weight:600}
.call-row .cr-num{color:var(--c2)}
.call-row .cr-time{opacity:.55;text-align:right}
.call-row .cr-st{text-align:right;font-size:6px;opacity:.6}
/* Android Auto */
.aa-top{flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line-strong);gap:10px}
.aa-brand{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--c2)}
.aa-brand span{font-family:var(--font-jp);font-size:9px;letter-spacing:1px;color:var(--c1);opacity:.7;margin-left:8px}
.aa-mid{font-family:var(--font-mono);font-size:6.5px;letter-spacing:1.5px;color:var(--c1);opacity:.65}
.aa-time{font-family:var(--font-mono);font-size:17px;font-weight:700;color:var(--c1);letter-spacing:1px}
.aa-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:7px;padding:7px 0}
.aa-map{position:relative;border:1px solid var(--line-strong);background:rgba(8,9,12,.94);overflow:hidden;min-height:0}
.aa-map svg{position:absolute;inset:0;width:100%;height:100%}
.aa-map .map-tag{position:absolute;left:10px;top:9px;font-size:7px;letter-spacing:2px;color:var(--c1);border:1px solid var(--line-strong);background:rgba(0,0,0,.6);padding:2px 6px}
.aa-map .map-eta{position:absolute;right:10px;bottom:9px;text-align:right;color:var(--c1)}
.aa-map .map-eta b{display:block;font-family:var(--font-mono);font-size:25px;color:var(--c2);line-height:1}
.aa-map .map-eta span{font-family:var(--font-mono);font-size:6.5px;letter-spacing:.8px;opacity:.7}
.aa-map .map-route{position:absolute;left:18px;top:38px;border:1px solid var(--line-strong);background:rgba(0,0,0,.65);padding:4px 7px;font-family:var(--font-jp);font-size:9px;color:var(--c1)}
.aa-side{display:flex;flex-direction:column;gap:7px;min-height:0}
.aa-card{flex:1;border:1px solid var(--line-strong);background:var(--panel2);padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:2px;overflow:hidden}
.aa-card .ac-k{font-size:6px;letter-spacing:2px;color:var(--c1);opacity:.6}
.aa-card .ac-v{font-size:17px;font-weight:600;letter-spacing:1px;color:var(--c2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.aa-card .ac-s{font-family:var(--font-mono);font-size:6px;letter-spacing:.5px;color:var(--c1);opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aa-dock{flex:0 0 62px;display:flex;align-items:center;justify-content:center;gap:8px;border-top:1px solid var(--line-strong);padding-top:7px}
.aa-app{width:62px;height:46px;border:1px solid var(--line-strong);background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--c1);cursor:pointer}
.aa-app svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
.aa-app span{font-size:5px;letter-spacing:1px}
.aa-app.on{background:var(--c2);color:var(--bg);border-color:var(--c2)}
/* call overlay */
.call-overlay{z-index:70;background:rgba(0,0,0,.86);align-items:center;justify-content:center;padding:0}
.call-card{width:620px;border:2px solid var(--c3);background:#060608;position:relative;display:flex;flex-direction:column}
.call-strip{height:14px;background:repeating-linear-gradient(-45deg,var(--c3) 0 9px,#000 9px 18px);border-bottom:1px solid #000}
.call-strip.bot{border-bottom:0;border-top:1px solid #000}
.call-body{padding:16px 26px 18px;display:flex;flex-direction:column;gap:5px}
.call-kicker{font-family:var(--font-jp);font-size:11px;font-weight:700;letter-spacing:3px;color:var(--c3);display:flex;justify-content:space-between;align-items:baseline}
.call-kicker .en{font-family:var(--font-en);font-size:8px;letter-spacing:2px;color:var(--c2)}
.call-name{font-size:38px;font-weight:700;letter-spacing:2px;color:var(--c2);line-height:1.05}
.call-meta{font-family:var(--font-mono);font-size:7px;letter-spacing:1px;color:var(--c1);opacity:.65}
.call-jp{font-family:var(--font-jp);font-size:13px;font-weight:700;letter-spacing:4px;color:var(--c3);margin-top:2px}
.call-btns{display:flex;gap:8px;margin-top:7px}
.call-btn{flex:1;padding:10px;border:1px solid;background:transparent;cursor:pointer;font-family:var(--font-en);font-size:11px;font-weight:700;letter-spacing:2px}
.call-btn.ans{border-color:var(--c2);color:var(--c2);background:rgba(77,232,154,.08)}
.call-btn.ans:hover{background:var(--c2);color:#000}
.call-btn.dec{border-color:var(--c3);color:var(--c3);background:var(--c3);color:var(--knock)}
.call-btn.dec:hover{background:#ff2e37}
.call-timer{font-family:var(--font-mono);font-size:20px;color:var(--c2);letter-spacing:2px}
/* reverse */
.reverse-overlay{z-index:80;background:#000;padding:0}
.rev-strip{flex:0 0 14px;background:repeating-linear-gradient(-45deg,var(--c3) 0 10px,#000 10px 20px)}
.rev-feed{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 65%,#15171a 0%,#08090b 58%,#000 100%)}
.rev-feed svg{position:absolute;inset:0;width:100%;height:100%}
.rev-top{position:absolute;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;color:var(--c1)}
.rev-top .k{font-family:var(--font-mono);font-size:7px;letter-spacing:1.4px;opacity:.7}
.rev-banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;border:2px solid var(--c3);background:rgba(0,0,0,.72);padding:10px 46px}
.rev-banner .jp{font-family:var(--font-jp);font-size:34px;font-weight:900;letter-spacing:14px;color:var(--knock);background:var(--c3);padding:2px 8px 2px 22px;line-height:1.1}
.rev-banner .en{font-size:18px;font-weight:700;letter-spacing:9px;color:var(--c3);margin-top:5px}
.rev-banner .sub{font-family:var(--font-jp);font-size:9px;font-weight:700;letter-spacing:2px;color:var(--c1);margin-top:3px}
.rev-seal{position:absolute;right:28px;bottom:24px;width:92px;height:92px}
.rev-seal .seal-oct{width:100%;height:100%;transform:rotate(6deg)}
.rev-seal b{font-size:19px}.rev-seal span{font-size:6px}
.rev-exit{position:absolute;right:16px;top:10px;z-index:2}
.rev-bottom{position:absolute;left:16px;right:16px;bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;color:var(--c1)}
.rev-bottom .warn{font-family:var(--font-jp);font-size:12px;font-weight:700;letter-spacing:4px;color:var(--c3)}
.rev-bottom .tiny{font-family:var(--font-mono);font-size:6px;letter-spacing:1px;opacity:.55}
/* sleep */
.sleep-overlay{z-index:90;background:#000;align-items:center;justify-content:center;cursor:pointer}
.sleep-overlay .s-jp{font-family:var(--font-jp);font-size:17px;font-weight:700;letter-spacing:6px;color:#2a2533}
.sleep-overlay .s-en{font-family:var(--font-mono);font-size:7px;letter-spacing:3px;color:#211d28;margin-top:7px}
/* toast */
.toast{
  position:absolute;left:50%;bottom:142px;transform:translateX(-50%);z-index:96;
  border:1px solid var(--c1);background:rgba(3,3,7,.96);color:var(--c1);
  font-family:var(--font-en);font-size:8px;font-weight:600;letter-spacing:2px;
  padding:6px 16px;white-space:nowrap;opacity:0;pointer-events:none;
}
.toast.show{opacity:1}
/* ───────── SIMULATOR PANEL ───────── */
.sim{
  width:326px;flex:0 0 326px;background:#0e0e13;border:1px solid #30303b;
  padding:12px 12px 16px;color:#b9b7c4;font-family:var(--font-en);
  max-height:806px;overflow-y:auto;border-radius:5px;
}
.sim::-webkit-scrollbar{width:7px}
.sim::-webkit-scrollbar-track{background:#0a0a0e}
.sim::-webkit-scrollbar-thumb{background:#353542}
.sim-title{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #3a3a46;padding-bottom:6px;margin-bottom:4px}
.sim-title h1{font-size:14px;font-weight:600;letter-spacing:3px;color:#ff6a3d}
.sim-title .v{font-family:var(--font-mono);font-size:6px;letter-spacing:1px;color:#666678}
.sim-zone{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  border:1px solid #33333f;background:#121218;padding:6px 8px;margin:7px 0 3px;
}
.sim-zone .zk{font-size:6px;letter-spacing:2px;color:#777786}
.sim-zone .zv{font-family:var(--font-mono);font-size:11px;font-weight:700;letter-spacing:1px;color:#4de89a}
.sim-zone[data-z="caution"] .zv{color:#f5b400}
.sim-zone[data-z="emergency"] .zv{color:#ff4a3c}
.sim h2{
  font-size:7px;letter-spacing:2.6px;color:#8d8b9c;margin:13px 0 6px;
  border-bottom:1px solid #2c2c37;padding-bottom:4px;font-weight:600;
}
.sim h2 span{float:right;font-family:var(--font-jp);letter-spacing:1px;color:#5d5b6c}
.sim-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px;min-height:20px}
.sim-row>label,.sim-lab{font-size:8px;letter-spacing:1.2px;color:#8f8d9e;flex:0 0 auto}
.sim-lab .jp{font-family:var(--font-jp);font-size:6.5px;color:#5f5d6e;margin-left:4px;letter-spacing:.5px}
.sim-val{font-family:var(--font-mono);font-size:10px;font-weight:700;color:#d9d4e4;min-width:36px;text-align:right}
.sim .seg{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.sim .seg button{
  background:#17171e;border:1px solid #3a3a47;color:#8b899a;
  font-family:var(--font-en);font-size:7px;font-weight:500;letter-spacing:.7px;
  padding:4px 6px;cursor:pointer;line-height:1;min-width:auto;
}
.sim .seg button:hover{border-color:#6a6878;color:#c9c5d4}
.sim .seg button.on{background:#ff4a1c;border-color:#ff4a1c;color:#09090e}
.sim .seg.blue button.on{background:#258ac3;border-color:#258ac3;color:#fff}
.sim .seg.amber button.on{background:#f5b400;border-color:#f5b400;color:#0a0904}
.sim input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0;
}
.sim input[type="range"]::-webkit-slider-runnable-track{height:3px;background:#353542}
.sim input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:13px;height:13px;margin-top:-5px;
  background:#ff4a1c;border:0;border-radius:0;transform:rotate(45deg);
}
.sim input[type="range"]::-moz-range-track{height:3px;background:#353542}
.sim input[type="range"]::-moz-range-thumb{width:11px;height:11px;background:#ff4a1c;border:0;border-radius:0;transform:rotate(45deg)}
.sim input[type="number"]{
  width:54px;background:#17171e;border:1px solid #3a3a47;color:#e4dfee;
  padding:3px 5px;font-family:var(--font-mono);font-size:9px;text-align:right;
}
.sim .quick{display:flex;gap:2px;margin-top:2px}
.sim .quick button{
  flex:1;background:#15151b;border:1px solid #32323e;color:#777586;
  font-family:var(--font-mono);font-size:6.5px;padding:3px 0;cursor:pointer;
}
.sim .quick button:hover{border-color:#60606f;color:#c9c5d4}
.sim .quick button.on{background:#2a2a35;border-color:#4de89a;color:#4de89a}
.sim .grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.sim .bigbtn{
  background:#17171e;border:1px solid #3a3a47;color:#a5a2b2;cursor:pointer;
  font-family:var(--font-en);font-size:7px;font-weight:600;letter-spacing:1px;
  padding:7px 5px;text-align:center;
}
.sim .bigbtn:hover{border-color:#6d6b7a;color:#e1dceb}
.sim .bigbtn.on{background:#4de89a;border-color:#4de89a;color:#07100b}
.sim .bigbtn.danger.on{background:#e31c23;border-color:#e31c23;color:#4de89a}
.sim .swatches{display:flex;gap:6px;justify-content:flex-end}
.sim .swatches button{
  width:24px;height:24px;border:1px solid rgba(255,255,255,.15);cursor:pointer;position:relative;padding:0;
}
.sim .swatches button.on{outline:2px solid #d9d4e4;outline-offset:2px}
.sim-note{
  font-family:var(--font-mono);font-size:6px;line-height:1.7;letter-spacing:.4px;
  color:#555364;border:1px dashed #2d2d38;padding:6px 7px;margin-top:10px;
}
.sim-note b{color:#8c8999;font-weight:700}
.sim .sep-line{height:1px;background:#24242e;margin:7px 0}
.device-caption{
  width:1052px;display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--font-mono);font-size:6.5px;letter-spacing:1px;color:#5f5c6e;padding:0 4px;
}
.device-caption b{font-family:var(--font-en);font-weight:600;letter-spacing:2px;color:#8a869b}
@media (max-width:1440px){
  body{zoom:.92}
}

</style>
